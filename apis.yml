aid: loopme
name: LoopMe
description: >-
  LoopMe is a global brand-performance advertising platform that uses AI to bring
  brands into mobile and CTV apps. Its products span an AI-powered intelligent
  marketplace, PurchaseLoop outcome-based brand advertising, the Chartboost
  in-app monetization platform, and an Audience & Measurement Platform (AMP).
  For developers, LoopMe exposes a REST Reporting API for publisher (app/site)
  and advertiser (campaign) statistics, a server-to-server (S2S) ad request API,
  first-party United SDKs for Android and iOS, and a Prebid.js header-bidding
  adapter. LoopMe is backed by HV Capital and headquartered in the UK.
