apis:
- aid: loopme:loopme-ad-serving-api
  name: LoopMe S2S Ad Serving API
  description: >-
    LoopMe's server-to-server ad request endpoint. A third-party ad server,
    exchange or mediation platform sends a GET describing the device, app and
    user, and LoopMe returns an MRAID ad payload (ad HTML plus impression and
    click beacon URLs), an empty ads array when there is no fill, or an HTTP 404
    error envelope. Identified by the appId LoopMe provisions to the publisher
    rather than by a token.
  humanURL: https://wiki.loopme.cool/publishers/integrations/s2s
  baseURL: https://loopme.me/api/s2s
  x-base-url-note: >-
    Corrected 2026-08-13. The tag-split refine pass had assigned this ad-serving
    operation the Reporting API base (https://reports.loopme.com/api/v1); the
    S2S reference documents https://loopme.me/api/s2s/ads, which matches
    openapi/_original/loopme-s2s-openapi.yml.
